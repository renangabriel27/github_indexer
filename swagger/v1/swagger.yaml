---
openapi: 3.0.1
info:
  title: GitHub Indexer API V1
  version: v1
  description: API para gerenciar perfis do GitHub indexados
paths:
  "/api/v1/profiles":
    get:
      summary: Lista perfis
      tags:
      - Profiles
      description: Retorna uma lista paginada de perfis do GitHub
      parameters:
      - name: page
        in: query
        required: false
        description: 'Número da página (padrão: 1)'
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        description: 'Itens por página (padrão: 10, máximo: 100)'
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        description: Offset para paginação baseada em offset
        schema:
          type: integer
      - name: search
        in: query
        required: false
        description: Buscar perfis por nome ou username
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Alias para o parâmetro search
        schema:
          type: string
      responses:
        '200':
          description: Busca de perfis
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        github_username:
                          type: string
                        short_github_url:
                          type: string
                          nullable: true
                        followers:
                          type: integer
                          nullable: true
                        following:
                          type: integer
                          nullable: true
                        stars:
                          type: integer
                          nullable: true
                        contributions_last_year:
                          type: integer
                          nullable: true
                        avatar_url:
                          type: string
                          nullable: true
                        location:
                          type: string
                          nullable: true
                        organizations:
                          type: array
                          items:
                            type: string
                          nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_count:
                        type: integer
                "$ref": "#/components/schemas/ProfilesResponse"
  "/api/v1/profiles/{id}":
    get:
      summary: Mostra um perfil
      tags:
      - Profiles
      description: Retorna os detalhes de um perfil específico
      parameters:
      - name: id
        in: path
        required: true
        description: ID do perfil
        schema:
          type: integer
      responses:
        '200':
          description: Perfil retornado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      github_username:
                        type: string
                      short_github_url:
                        type: string
                        nullable: true
                      followers:
                        type: integer
                        nullable: true
                      following:
                        type: integer
                        nullable: true
                      stars:
                        type: integer
                        nullable: true
                      contributions_last_year:
                        type: integer
                        nullable: true
                      avatar_url:
                        type: string
                        nullable: true
                      location:
                        type: string
                        nullable: true
                      organizations:
                        anyOf:
                        - type: array
                          items:
                            type: string
                        - type: string
        '404':
          description: Perfil não encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
servers:
- url: http://localhost:3000
  description: Development server
components:
  schemas:
    Profile:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        github_username:
          type: string
        short_github_url:
          type: string
          nullable: true
        followers:
          type: integer
          nullable: true
        following:
          type: integer
          nullable: true
        stars:
          type: integer
          nullable: true
        contributions_last_year:
          type: integer
          nullable: true
        avatar_url:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        organizations:
          type: array
          items:
            type: string
          nullable: true
    ProfileResponse:
      type: object
      properties:
        data:
          "$ref": "#/components/schemas/Profile"
    ProfilesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Profile"
        meta:
          type: object
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total_pages:
              type: integer
            total_count:
              type: integer
    Error:
      type: object
      properties:
        error:
          type: string
