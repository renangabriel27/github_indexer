# Using Redis adapter for ActionCable to support background jobs broadcasting
# Async adapter only works within the same process, but Sidekiq runs in a separate process
# Using the same Redis database as Sidekiq for proper message delivery
development:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL", "redis://localhost:6379/0") %>

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
