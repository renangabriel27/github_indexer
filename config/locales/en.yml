# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  profiles:
    messages:
      created: "Profile created successfully!"
      updated: "Profile updated successfully!"
      deleted: "Profile removed successfully!"
      rescan_started: "Rescan started!"
      rescan_wait: "Please wait a few minutes before rescanning again"
  errors:
    not_found:
      title: "Page Not Found"
      message: "The page you are looking for does not exist or has been moved. Please check the address and try again."
      back_to_home: "Back to Home"
    internal_server_error:
      title: "Internal Server Error"
      message: "Something went wrong on the server. Our team has been notified and is working to resolve the issue. Please try again in a few moments."
      back_to_home: "Back to Home"
    unprocessable_entity:
      title: "Unprocessable Request"
      message: "The change you tried to make was rejected. You may have tried to modify something without permission or the submitted data is invalid."
      back_to_home: "Back to Home"
